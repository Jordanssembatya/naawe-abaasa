services:
  - type: web
    name: naawe-abaasa
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: NODE_VERSION
        value: "22"
    routes:
      # Client-side routing: serve index.html for every path (e.g. /products/123 on refresh)
      - type: rewrite
        source: /*
        destination: /index.html
